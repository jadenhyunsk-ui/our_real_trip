<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F3D3A">
<title>여행 전체 관리</title>
<style>
:root{
  --bg:#F1F7F3;
  --card:#FFFFFF;
  --ink:#0F3D3A;
  --muted:#6B8783;
  --line:#DCE8E1;
  --grid:#E4EFE9;
  --navy:#0F3D3A;
  --steel:#2E5F72;
  --coral:#F2685A;
  --sand:#FCE3DF;
  --green:#2E7D5B;
  --amber:#B8791F;
  --gold:#FFC978;
  --red:#C1543A;
  --sat-blue:#2563EB;
  --font:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-bottom:70px;overflow-x:hidden;max-width:100vw;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;color:inherit;font-size:13px;}
a{color:inherit;text-decoration:none;}

/* ===== 여행 선택 바 ===== */
.tripbar{background:linear-gradient(135deg,var(--coral),#dd5138);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;
  align-items:center;gap:8px;font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(221,92,54,.2);}
.tripbar-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;gap:6px;}
.tripbar-name .tb-icon,.tripbar-name svg{width:14px;height:14px;flex:0 0 auto;}
.tripbar-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tripbar-chev{flex:0 0 auto;font-size:11px;font-weight:600;opacity:.9;white-space:nowrap;}
.trip-list{margin-bottom:12px;max-height:40vh;overflow-y:auto;}
.trip-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--grid);}
.trip-row:last-child{border-bottom:none;}
.trip-row.active .trip-row-name{color:var(--coral);font-weight:700;}
.trip-row-namewrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.trip-row-name{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;
  font-size:13px;background:#FCFAF6;}
.trip-row-cap{font-size:10px;color:var(--muted);padding-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.trip-row-select{flex:0 0 auto;font-size:11px;font-weight:700;color:#fff;background:var(--navy);
  border-radius:6px;padding:7px 10px;white-space:nowrap;}
.trip-row-select:disabled{background:var(--sand);color:var(--muted);}
.trip-row-del{flex:0 0 auto;font-size:12px;color:var(--red);width:30px;height:30px;}
.trip-add-row{display:flex;gap:6px;margin-bottom:8px;}
.trip-add-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:8px 9px;
  font-size:13px;background:#FCFAF6;}
.trip-add-row button{flex:0 0 auto;font-size:12px;font-weight:700;color:#fff;background:var(--coral);
  border-radius:6px;padding:8px 12px;white-space:nowrap;}

/* ===== 헤더 ===== */
.appbar{background:linear-gradient(160deg,var(--navy),#0a2a28);color:#fff;padding:11px 12px 9px;}
.appbar-row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 8px;flex-wrap:wrap;}
.appbar-row>div:first-child{flex:1 1 150px;min-width:0;}
.app-title{font-size:16px;font-weight:700;letter-spacing:-.02em;overflow-wrap:break-word;}
.app-sub{font-size:11px;color:#9DB4C7;margin-top:2px;overflow-wrap:break-word;}
.sync-pill{display:inline-block;max-width:100%;margin-top:6px;font-size:10px;font-family:var(--mono);
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:3px 8px;border-radius:999px;color:#C6D6E2;
  white-space:normal;overflow-wrap:break-word;transition:background .2s,border-color .2s,color .2s;}
.sync-pill.ok{background:rgba(46,125,91,.28);border-color:rgba(46,125,91,.45);color:#BFE8D3;}
.sync-pill.err{background:rgba(193,84,58,.28);border-color:rgba(193,84,58,.45);color:#F3C7BA;}
.appbar-actions{display:flex;gap:4px;flex:0 0 auto;}
.ab-btn{font-size:10.5px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
  color:#fff;padding:8px 10px;min-height:34px;min-width:34px;border-radius:7px;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;}
.ab-btn svg{width:15px;height:15px;}
.ab-btn.primary{background:var(--coral);border-color:var(--coral);}
.ab-btn.excel{background:rgba(30,140,90,.22);border-color:rgba(30,140,90,.4);color:#8CE0B4;}

/* ===== 탭바 ===== */
.tabbar{position:sticky;top:0;z-index:50;background:var(--navy);display:flex;gap:5px;
  padding:0 10px 9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  box-shadow:0 3px 8px rgba(0,0,0,.12);}
.tabbar::-webkit-scrollbar{display:none;}
.tab-btn{flex:0 0 auto;font-size:12px;font-weight:600;color:#A5BACA;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);padding:9px 13px;min-height:36px;border-radius:7px;white-space:nowrap;}
.tab-btn.active{background:#fff;color:var(--coral);border-color:#fff;}

main{padding:12px 10px;max-width:100%;}

/* ===== 섹션 헤더 ===== */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 7px;}
.sec-head:first-child{margin-top:0;}
.sec-title{font-size:14.5px;font-weight:700;color:var(--navy);}
.sec-count{font-size:11px;font-family:var(--mono);color:var(--muted);}

/* ===== 설정 바 ===== */
.setbar{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:12px;}
.setbar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.setbar-title{font-size:12.5px;font-weight:700;color:var(--navy);display:flex;align-items:baseline;gap:6px;min-width:0;}
.setbar-summary{font-size:10.5px;font-weight:400;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ios-switch{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 auto;}
.ios-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.ios-switch .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .2s;}
.ios-switch .slider::before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s;}
.ios-switch input:checked+.slider{background:var(--coral);}
.ios-switch input:checked+.slider::before{transform:translateX(18px);}
.setbar-body{overflow:hidden;max-height:400px;opacity:1;margin-top:9px;transition:max-height .25s ease,opacity .2s ease,margin-top .25s ease;}
.setbar-body.collapsed{max-height:0;opacity:0;margin-top:0;}
.setgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.setgrid .sf{min-width:0;display:flex;flex-direction:column;gap:3px;}
@media (min-width:480px){.setgrid{grid-template-columns:repeat(5,1fr);}}
.setgrid .sf label{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;}
.setgrid .sf input,.setgrid .sf select{border:1px solid var(--line);border-radius:6px;padding:7px 8px;
  font-size:13px;background:#FCFAF6;width:100%;outline:none;}
.setgrid .sf input:focus,.setgrid .sf select:focus{border-color:var(--coral);background:#fff;}
.setgrid .sf-row3{grid-column:1/-1;display:flex;gap:6px;}
.setgrid .sf-row3 .sf{flex:1 1 0;min-width:0;}
.setgrid .sf-row3 .sf.sf-dest{flex:1.3 1 0;}
.setgrid .sf-row3 input{padding:7px 4px;font-size:12px;}
.cur-field-wrap{display:flex;align-items:center;gap:4px;}
.cur-field-wrap select{flex:1 1 auto;min-width:0;}
.btn-addcur,.btn-rmcur{flex:0 0 auto;width:26px;height:26px;border-radius:6px;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;}
.btn-addcur{background:var(--steel);color:#fff;}
.btn-rmcur{background:#FCE3DF;color:var(--red);}
.rate-note{margin-top:6px;font-size:10.5px;color:var(--muted);font-family:var(--mono);}

/* ===== 엑셀형 표 ===== */
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.grid{border-collapse:collapse;width:100%;}
table.grid th,table.grid td{border:1px solid var(--grid);padding:0;vertical-align:middle;}
table.grid thead th{
  background:var(--steel);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:8px 6px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:2;
}
table.grid thead th:first-child{position:sticky;left:0;top:0;z-index:4;}
table.grid tbody td{background:#fff;}
table.grid tbody tr:nth-child(even) td{background:#FCFAF5;}
table.grid td input,table.grid td select,table.grid td textarea{
  width:100%;border:none;background:transparent;padding:8px 7px;font-size:13px;outline:none;display:block;
}
table.grid td textarea{resize:vertical;min-height:34px;line-height:1.4;overflow:hidden;}
table.grid td input:focus,table.grid td select:focus,table.grid td textarea:focus{background:#FFF6E9;}
table.grid td.num input{text-align:right;font-family:var(--mono);color:var(--amber);font-weight:700;}
table.grid td.ctr{text-align:center;}
table.grid td.rowhead{
  background:var(--sand)!important;font-size:11px;font-weight:700;color:var(--navy);
  text-align:center;padding:6px 4px;white-space:nowrap;position:sticky;left:0;z-index:1;
}
table.grid td.del{width:32px;text-align:center;background:#FAF7F1!important;}
table.grid td.del button{width:100%;padding:8px 0;color:var(--red);font-size:13px;}
table.grid tbody tr.cat-tinted td{background:var(--cat-bg)!important;}
table.grid tbody tr.cat-boundary td{border-top:8px solid var(--bg);}
table.grid td.chk{width:44px;text-align:center;background:#FAF7F1;}
table.grid td.chk input{width:18px;height:18px;accent-color:var(--green);margin:8px auto;display:block;}
table.grid tr.checklist-done td{opacity:.55;}
table.grid tr.checklist-done td input[type=text]{text-decoration:line-through;}
tr.subtotal td{background:var(--sand)!important;font-weight:700;font-size:12px;color:var(--navy);padding:7px 8px!important;}
tr.subtotal td.num{text-align:right;font-family:var(--mono);color:var(--coral);}
.money-cell{display:flex;align-items:center;width:100%;}
.money-cell input{flex:1 1 0%!important;min-width:0!important;width:auto!important;text-align:right;font-family:var(--mono);padding-right:4px!important;}
.money-cell input::-webkit-outer-spin-button,.money-cell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.money-cell input[type=number]{-moz-appearance:textfield;}
.money-cell select{width:auto!important;min-width:0!important;flex:0 0 auto!important;font-size:10px;padding:8px 1px 8px 2px!important;color:var(--muted);
  border-left:1px solid var(--grid)!important;}
.scroll-hint{font-size:10px;color:var(--muted);font-family:var(--mono);padding:6px 9px;background:#FAF7F1;border-top:1px solid var(--grid);}

/* ===== 버튼 ===== */
.btn-add{width:100%;padding:10px;font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--steel),#1f4552);border-radius:8px;margin-top:8px;box-shadow:0 2px 8px rgba(46,95,114,.25);}
.btn-add.ghost{background:transparent;color:var(--steel);border:1.5px dashed var(--line);box-shadow:none;}
.btn-wide{width:100%;padding:13px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--coral),#dd5138);
  border-radius:9px;margin-top:14px;box-shadow:0 4px 12px rgba(221,92,54,.28);}
.empty{text-align:center;padding:20px 14px;font-size:12.5px;color:var(--muted);
  background:var(--card);border-radius:9px;border:1.5px dashed var(--line);}

/* ===== 날짜 탭(지출노트) ===== */
.daypills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:11px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.daypills::-webkit-scrollbar{display:none;}
.daypill{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--navy);background:var(--card);
  border:1px solid var(--line);padding:8px 13px;border-radius:20px;white-space:nowrap;}
.daypill.active{background:var(--coral);color:#fff;border-color:var(--coral);}
.wk-sat{color:var(--sat-blue);}
.wk-sun{color:var(--red);}
.daypill.active .wk-sat,.daypill.active .wk-sun{color:#fff;}

/* ===== 타임라인 (일정) ===== */
.tl-undated{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:11px;}
.tl-undated-label{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:7px;}
.tl-undated-item{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.tl-undated-item:last-child{margin-bottom:0;}
.tl-undated-item input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px;background:#FCFAF6;}
.tl-undated-item button{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--navy);background:var(--sand);
  border:1px solid var(--line);border-radius:6px;padding:7px 9px;white-space:nowrap;}
.tl-wrap{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.tl-scroll{position:relative;overflow-y:auto;overflow-x:hidden;max-height:64vh;-webkit-overflow-scrolling:touch;}
.tl-inner{position:relative;margin-left:54px;margin-right:8px;}
.tl-hour-line{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--grid);}
.tl-hour-label{position:absolute;left:-52px;width:46px;font-size:10px;color:var(--muted);
  font-family:var(--mono);text-align:right;pointer-events:none;}
.tl-item{position:absolute;left:2px;right:2px;background:#FFF6E9;border:1px solid var(--coral);border-left:4px solid var(--coral);
  border-radius:6px;padding:3px 20px 3px 6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.tl-time{font-size:9px;font-family:var(--mono);color:var(--coral);font-weight:700;line-height:1.2;}
.tl-activity{width:100%;border:none;background:transparent;font-size:12.5px;padding:1px 0;outline:none;color:var(--ink);
  font-family:inherit;line-height:1.35;resize:none;overflow-y:auto;}
.tl-del{position:absolute;top:2px;right:2px;font-size:9px;color:var(--red);width:16px;height:16px;line-height:16px;text-align:center;z-index:3;}
.tl-handle{position:absolute;bottom:0;left:0;right:0;height:11px;cursor:ns-resize;text-align:center;
  font-size:8px;color:var(--muted);line-height:9px;touch-action:none;letter-spacing:1px;}
.tl-handle-top{bottom:auto;top:0;}
.tl-backdrop{position:fixed;inset:0;background:rgba(30,39,51,.45);z-index:300;}
.tl-editor{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:14px 14px 0 0;padding:16px;
  box-shadow:0 -4px 20px rgba(0,0,0,.2);max-height:80vh;overflow-y:auto;}
.tl-editor-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:12px;}
.tl-editor-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;}
.tl-editor-row span{font-size:12.5px;color:var(--muted);}
.tl-editor-row select{padding:7px 4px;font-size:14px;border:1px solid var(--line);border-radius:6px;background:#FCFAF6;}
.tl-editor textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-size:13px;
  margin-bottom:12px;background:#FCFAF6;resize:vertical;}
.tl-editor-btns{display:flex;gap:8px;}
.tl-editor-btns button{flex:1;padding:11px;border-radius:8px;font-weight:700;font-size:13.5px;}
.tl-editor-btns button:first-child{background:var(--sand);color:var(--navy);}
.tl-editor-btns button:last-child{background:var(--coral);color:#fff;}

/* ===== 합계 바 ===== */
.total-bar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--navy),#0a2a28);color:#fff;
  border-radius:9px;padding:11px 13px;margin-top:10px;box-shadow:0 3px 10px rgba(15,61,58,.25);}
.total-bar .l{font-size:11.5px;color:#9DB4C7;}
.total-bar .v{font-size:15px;font-weight:700;text-align:right;color:var(--gold);}
.total-bar .v small{display:block;font-size:11px;font-weight:400;color:#9DB4C7;margin-top:2px;}

/* ===== 토스트 ===== */
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);
  background:var(--green);color:#fff;font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .2s;z-index:200;box-shadow:0 3px 12px rgba(0,0,0,.15);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

</style>
</head>
<body>
<div id="tripbar"></div>
<div id="appbar"></div>
<nav class="tabbar" id="tabbar"></nav>
<main id="content"></main>
<div id="toast" class="toast">저장됨 ✓</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
/* ===== 저장소 ===== */
var STORAGE_KEY='tripData_v4';
var ACTIVE_KEY='tripActiveId_v1';
function uid(){return 'id_'+Math.random().toString(36).slice(2,9);}
var PAY_OPTS=['카드','현금','마일리지','기타'];
var EXP_CATS=['항공권','숙박비','식비','간식','교통','쇼핑','기념품','관광/입장료','통신','보험','수수료','기타'];

/* ===== 통화 ===== */
var CURRENCIES=[
 {code:'AUD',name:'호주 달러',sym:'A$',rate:920},
 {code:'JPY',name:'일본 엔',sym:'¥',rate:9.3},
 {code:'USD',name:'미국 달러',sym:'$',rate:1380},
 {code:'EUR',name:'유로',sym:'€',rate:1500},
 {code:'GBP',name:'영국 파운드',sym:'£',rate:1750},
 {code:'CNY',name:'중국 위안',sym:'¥',rate:192},
 {code:'HKD',name:'홍콩 달러',sym:'HK$',rate:177},
 {code:'TWD',name:'대만 달러',sym:'NT$',rate:43},
 {code:'SGD',name:'싱가포르 달러',sym:'S$',rate:1030},
 {code:'THB',name:'태국 바트',sym:'฿',rate:40},
 {code:'VND',name:'베트남 동',sym:'₫',rate:0.055},
 {code:'PHP',name:'필리핀 페소',sym:'₱',rate:24},
 {code:'MYR',name:'말레이시아 링깃',sym:'RM',rate:310},
 {code:'IDR',name:'인도네시아 루피아',sym:'Rp',rate:0.085},
 {code:'NZD',name:'뉴질랜드 달러',sym:'NZ$',rate:840},
 {code:'CAD',name:'캐나다 달러',sym:'C$',rate:1010},
 {code:'CHF',name:'스위스 프랑',sym:'Fr',rate:1600},
 {code:'AED',name:'UAE 디르함',sym:'AED',rate:376},
 {code:'INR',name:'인도 루피',sym:'₹',rate:16.5},
 {code:'TRY',name:'튀르키예 리라',sym:'₺',rate:34},
 {code:'MOP',name:'마카오 파타카',sym:'MOP',rate:172},
 {code:'KRW',name:'대한민국 원',sym:'₩',rate:1}
];
/* 여행지 키워드 → 통화코드 */

function guessCurrency(dest){
  if(!dest)return null;
  var s=String(dest).toLowerCase();
  for(var i=0;i<DEST_MAP.length;i++){
    var keys=DEST_MAP[i][0];
    for(var j=0;j<keys.length;j++){ if(s.indexOf(keys[j])>-1) return DEST_MAP[i][1]; }
  }
  return null;
}
function curInfo(code){
  for(var i=0;i<CURRENCIES.length;i++){if(CURRENCIES[i].code===code)return CURRENCIES[i];}
  return CURRENCIES[CURRENCIES.length-1];
}
function localCur(D){return (D.meta&&D.meta.currency)||'AUD';}
function localRate(D){
  var r=Number(D.meta&&D.meta.rate);
  if(!r||isNaN(r)||r<=0)r=curInfo(localCur(D)).rate;
  return r;
}
/* 통화코드에 해당하는 환율(현지통화/추가통화/기본표 순으로 조회) */
function rateFor(D,code){
  if(!code||code==='KRW')return 1;
  if(code===localCur(D))return localRate(D);
  var ex=((D.meta&&D.meta.extraCurrencies)||[]).filter(function(e){return e.code===code;})[0];
  if(ex){var r=Number(ex.rate);if(r&&!isNaN(r)&&r>0)return r;}
  return curInfo(code).rate;
}
/* 셀렉트 드롭다운에 표시할 통화 목록: 현지통화 → 추가통화(최대 2개) → KRW */
function availableCurrencyCodes(D){
  var codes=[localCur(D)];
  ((D.meta&&D.meta.extraCurrencies)||[]).forEach(function(e){if(codes.indexOf(e.code)<0)codes.push(e.code);});
  if(codes.indexOf('KRW')<0)codes.push('KRW');
  return codes;
}
/* 금액을 원화로 환산 */
function toKRW(amount,cur,D){
  var v=Number(amount);
  if(!v||isNaN(v))return 0;
  if(cur==='KRW')return v;
  return v*rateFor(D,cur);
}
function money(n){var v=Number(n);if(isNaN(v)||n===''||n==null)return '';
  return Math.round(v).toLocaleString('ko-KR');}
function moneyCur(n,cur){
  if(n===''||n==null||isNaN(Number(n)))return '-';
  return curInfo(cur).sym+money(n);
}

function deepMerge(base,inc){var out={};for(var k in base)out[k]=base[k];
  for(var j in (inc||{})){if(inc[j]!==undefined&&inc[j]!==null)out[j]=inc[j];}return out;}
/* 구버전 항공 데이터를 여정(왕복/편도) + 단일 구간목록(segs) 구조로 변환 */
function migrateFlights(d){
  var arr=d.flights;
  if(!arr||!arr.length)return;
  var segOf=function(f){return{id:f.id||uid(),date:f.date||'',time:f.time||'',arriveTime:f.arriveTime||'',
    airline:f.airline||'',flightNo:f.flightNo||'',from:f.from||'',to:f.to||''};};
  /* 가장 오래된 형태: 평탄한 항공편 배열(레그 단위) */
  if(arr[0]&&arr[0].dep===undefined&&arr[0].segs===undefined){
    var memoParts=[],agency='',price='',priceCur='KRW',payment='카드',got=false;
    var segs=arr.map(function(f){
      if(!got&&f.price){agency=f.agency||'';price=f.price;priceCur=f.priceCur||'KRW';payment=f.payment||'카드';got=true;}
      if(f.memo)memoParts.push(f.memo);
      return segOf(f);
    });
    if(!got&&arr[0]){agency=arr[0].agency||'';price=arr[0].price||'';priceCur=arr[0].priceCur||'KRW';payment=arr[0].payment||'카드';}
    d.flights=[{id:uid(),tripType:'편도',agency:agency,price:price,priceCur:priceCur,payment:payment,
      memo:memoParts.join(' / '),segs:segs}];
    return;
  }
  /* 중간 형태: 여정 안에 dep/ret로 나뉜 구조 → 하나의 segs 목록으로 합치기 */
  d.flights.forEach(function(j){
    if(j.segs===undefined){
      j.segs=(j.dep||[]).concat(j.ret||[]);
      delete j.dep;delete j.ret;
    }
  });
}
function blankTripData(){
  var t=defaultTripData();
  t.flights=[];t.tourCompare=[];
  t.meta=deepMerge(t.meta,{title:'',destination:'',currency:'AUD',rate:920,startDate:'',endDate:''});
  return t;
}
function fixTripData(raw){
  var merged=deepMerge(defaultTripData(),raw||{});
  merged.meta=deepMerge(defaultTripData().meta,(raw&&raw.meta)||{});
  migrateFlights(merged);
  return merged;
}
function defaultAllData(){
  var tid=uid();var trips={};trips[tid]=defaultTripData();
  return {trips:trips,tripOrder:[tid]};
}
/* 구버전(단일 여행, 평탄 구조) 데이터를 {trips,tripOrder} 구조로 감싸기 */
function wrapAsMultiTrip(raw){
  var tid=uid();var trips={};trips[tid]=fixTripData(raw);
  return {trips:trips,tripOrder:[tid]};
}
function normalizeAllData(all){
  if(!all||!all.trips)return null;
  var order=(all.tripOrder&&all.tripOrder.length)?all.tripOrder.slice():Object.keys(all.trips);
  var fixed={};
  order.forEach(function(tid){
    var t=all.trips[tid];
    if(!t)return;
    fixed[tid]=fixTripData(t);
  });
  order=order.filter(function(tid){return fixed[tid];});
  if(!order.length)return null;
  return {trips:fixed,tripOrder:order};
}
function loadData(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return defaultAllData();
    var parsed=JSON.parse(raw);
    var all=parsed&&parsed.trips?normalizeAllData(parsed):wrapAsMultiTrip(parsed);
    return all||defaultAllData();
  }catch(e){console.error(e);return defaultAllData();}
}

/* ===== 엑셀(.xlsx) 내보내기 — 탭별 시트 + 원본과 비슷한 스타일 ===== */
function addExcelSheet(wb,name,headers,rows,moneyColIdx){
  var ws=wb.addWorksheet(name);
  var headerRow=ws.addRow(headers);
  headerRow.eachCell(function(cell){
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2E5F72'}};
    cell.font={color:{argb:'FFFFFFFF'},bold:true,size:10};
    cell.alignment={vertical:'middle',horizontal:'center'};
  });
  headerRow.height=20;
  rows.forEach(function(r,ri){
    var row=ws.addRow(r);
    if(ri%2===1){
      row.eachCell(function(cell){cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFCFAF5'}};});
    }
    if(moneyColIdx!=null){
      var cell=row.getCell(moneyColIdx+1);
      cell.font={color:{argb:'FFB8791F'},bold:true};
      cell.alignment={horizontal:'right'};
      if(cell.value!=null&&cell.value!==''&&!isNaN(Number(cell.value)))cell.numFmt='#,##0';
    }
  });
  headers.forEach(function(h,i){ws.getColumn(i+1).width=Math.max(10,String(h).length*1.6,14);});
  ws.views=[{state:'frozen',ySplit:1}];
  return ws;
}
function buildExcelWorkbook(D){
  var wb=new ExcelJS.Workbook();
  wb.creator='여행 관리';
  wb.created=new Date();

  var flightRows=[];
  (D.flights||[]).forEach(function(j){
    (j.segs||[]).forEach(function(s,si){
      flightRows.push([j.tripType,s.date,s.time,s.arriveTime,s.airline,s.flightNo,s.from,s.to,
        si===0?j.agency:'',si===0?j.price:'',si===0?j.priceCur:'',si===0?j.payment:'',si===0?j.memo:'']);
    });
  });
  addExcelSheet(wb,'항공',['여정','날짜','출발','도착','항공사','편명','출발지','도착지','예약처','금액','통화','결제','비고'],flightRows,9);

  var dates=dateRange(D.meta.startDate,D.meta.endDate);
  var hotelRows=dates.map(function(d){
    var h=(D.hotels||{})[d]||{};
    return [d,h.name||'',h.place||'',h.agency||'',h.price||'',h.priceCur||'',h.payment||'',h.memo||''];
  });
  addExcelSheet(wb,'호텔',['일정','호텔명','장소','예약처','금액','통화','결제','비고'],hotelRows,4);

  var tourRows=(D.tours||[]).map(function(t){return [t.date,t.region,t.tourName,t.program,t.agency,t.price,t.priceCur,t.payment,t.memo];});
  addExcelSheet(wb,'투어',['날짜','지역','투어명','프로그램','예약처','금액','통화','결제','비고'],tourRows,5);

  var expRows=(D.expenses||[]).map(function(e){return [e.date,e.cat,e.item,e.price,e.priceCur,e.payment,e.memo];});
  addExcelSheet(wb,'지출노트',['날짜','카테고리','사용내역','금액','통화','결제','비고'],expRows,3);

  var rcRows=(D.rentalcar||[]).map(function(r){return [r.date,r.time,r.company,r.carType,r.price,r.priceCur,r.insurance,r.payment,r.memo];});
  addExcelSheet(wb,'렌트카',['날짜','시간','업체','차종','가격','통화','보험','결제','비고'],rcRows,4);

  return wb;
}
function exportExcel(){
  if(typeof ExcelJS==='undefined'){alert('엑셀 내보내기 기능을 불러오는 중입니다. 인터넷 연결을 확인하고 잠시 후 다시 시도해주세요.');return;}
  var wb=buildExcelWorkbook(D);
  wb.xlsx.writeBuffer().then(function(buf){
    var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url=URL.createObjectURL(blob);var a=document.createElement('a');
    a.href=url;a.download=(D.meta.title||'여행')+'-'+new Date().toISOString().slice(0,10)+'.xlsx';
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }).catch(function(e){console.error(e);alert('엑셀 파일 생성에 실패했습니다.');});
}
function importFile(f,cb){
  var r=new FileReader();
  r.onload=function(e){
    try{
      var parsed=JSON.parse(e.target.result);
      var all=parsed&&parsed.trips?normalizeAllData(parsed):wrapAsMultiTrip(parsed);
      if(!all)throw new Error('빈 데이터');
      AllData=all;
      if(!AllData.trips[activeTripId])activeTripId=AllData.tripOrder[0];
      D=AllData.trips[activeTripId];
      localStorage.setItem(STORAGE_KEY,JSON.stringify(AllData));
      try{localStorage.setItem(ACTIVE_KEY,activeTripId);}catch(err){}
      fbQueueSync('*ALL*');
      if(cb)cb();
    }catch(err){alert('JSON을 읽을 수 없습니다: '+err.message);}
  };
  r.readAsText(f,'utf-8');
}
function fmtLocalDate(d){
  var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}
function dateRange(s,e){var out=[];if(!s||!e)return out;
  var d=new Date(s+'T00:00:00'),en=new Date(e+'T00:00:00');
  if(isNaN(d)||isNaN(en)||d>en)return out;
  while(d<=en){out.push(fmtLocalDate(d));d.setDate(d.getDate()+1);}return out;}
function wk(s){return ['일','월','화','수','목','금','토'][new Date(s+'T00:00:00').getDay()];}
function wkClass(w){return w==='토'?'wk-sat':(w==='일'?'wk-sun':'');}
function mmdd(s){return s?s.slice(5,7)+'/'+s.slice(8,10):'';}
/* 여행 설정 요약·여행 이름에서만 쓰는, 연도를 포함한 날짜 표기 */
function mmddFull(s){return s?s.slice(0,4)+'.'+s.slice(5,7)+'.'+s.slice(8,10):'';}
function nextDay(s){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+1);return fmtLocalDate(d);}
function dayBefore(s){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()-1);return fmtLocalDate(d);}

var fbStorage=null;
function fbInit(){
  try{
    if(typeof firebase==='undefined'){fbStatus='error';updateSyncPill();return;}
    firebase.initializeApp(firebaseConfig);
    fbRef=firebase.database().ref('trip');
    fbRef.on('value',onFbValue,function(err){fbStatus='error';console.error('firebase',err);updateSyncPill();});
    try{if(firebase.storage)fbStorage=firebase.storage();}catch(se){console.error('storage init',se);}
  }catch(e){console.error(e);fbStatus='error';updateSyncPill();}
}
function onFbValue(snap){
  var remote=snap.val();
  fbStatus='synced';
  if(!remote){
    fbRef.set(AllData).catch(function(e){console.error(e);});
    updateSyncPill();return;
  }
  if(!remote.trips){
    /* 구버전(단일 여행) 데이터가 서버에 남아있음 → 서버 내용을 보존한 채 다중 여행 구조로 감싸서 다시 저장 */
    var wrapped=wrapAsMultiTrip(remote);
    AllData=wrapped;
    activeTripId=wrapped.tripOrder[0];
    D=AllData.trips[activeTripId];
    try{localStorage.setItem(ACTIVE_KEY,activeTripId);}catch(e){}
    localStorage.setItem(STORAGE_KEY,JSON.stringify(AllData));
    fbRef.set(AllData).catch(function(e){console.error(e);});
    scheduleRerender();
    return;
  }
  var changed=false;
  var order=(remote.tripOrder&&remote.tripOrder.length)?remote.tripOrder:Object.keys(remote.trips);
  var newTrips={};
  order.forEach(function(tid){
    var rt=remote.trips[tid];
    if(!rt)return;
    var lt=AllData.trips[tid];
    if(!lt){
      newTrips[tid]=fixTripData(rt);
      changed=true;
      return;
    }
    for(var k in rt){
      var tk=tid+'::'+k;
      if(fbWriteTimers[tk])continue;
      if(JSON.stringify(rt[k])!==JSON.stringify(lt[k])){lt[k]=rt[k];changed=true;}
    }
    if(!fbWriteTimers[tid+'::flights'])migrateFlights(lt);
    newTrips[tid]=lt;
  });
  if(!order.length)return;
  AllData.trips=newTrips;
  if(AllData.tripOrder.join(',')!==order.join(',')){AllData.tripOrder=order;changed=true;}
  if(!AllData.trips[activeTripId]){
    activeTripId=AllData.tripOrder[0];
    try{localStorage.setItem(ACTIVE_KEY,activeTripId);}catch(e){}
    changed=true;
  }
  D=AllData.trips[activeTripId];
  if(changed){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(AllData));
    scheduleRerender();
  }else{updateSyncPill();}
}
function fbQueueSync(key){
  if(!fbRef)return;
  if(key==='tripOrder'){
    fbRef.child('tripOrder').set(AllData.tripOrder).catch(function(e){console.error(e);});
    return;
  }
  if(!key||key==='*ALL*'){fbRef.set(AllData).catch(function(e){console.error(e);});return;}
  var tk=activeTripId+'::'+key;
  if(fbWriteTimers[tk])clearTimeout(fbWriteTimers[tk]);
  fbWriteTimers[tk]=setTimeout(function(){
    delete fbWriteTimers[tk];
    var upd={};upd[key]=D[key];
    fbRef.child('trips/'+activeTripId).update(upd).catch(function(e){console.error('fb sync',e);});
  },500);
}
function fbPushNewTrip(tid){
  if(!fbRef)return;
  fbRef.child('trips/'+tid).set(AllData.trips[tid]).catch(function(e){console.error(e);});
  fbRef.child('tripOrder').set(AllData.tripOrder).catch(function(e){console.error(e);});
}
function fbDeleteTrip(tid){
  if(!fbRef)return;
  fbRef.child('trips/'+tid).remove().catch(function(e){console.error(e);});
  fbRef.child('tripOrder').set(AllData.tripOrder).catch(function(e){console.error(e);});
}
function updateSyncPill(){
  var pill=document.getElementById('syncPill');
  if(!pill)return;
  if(fbStatus==='synced'){pill.textContent='🟢 Connected';pill.className='sync-pill ok';}
  else if(fbStatus==='error'){pill.textContent='🔴 Disconnected — 새로고침 해보세요';pill.className='sync-pill err';}
  else{pill.textContent='🟡 Connecting…';pill.className='sync-pill';}
}

function switchTrip(tid){
  if(!AllData.trips[tid])return false;
  activeTripId=tid;
  try{localStorage.setItem(ACTIVE_KEY,tid);}catch(e){}
  D=AllData.trips[tid];
  return true;
}
function addTrip(title){
  var tid=uid();
  AllData.trips[tid]=blankTripData();
  AllData.trips[tid].meta.title=title||'제목 없는 여행';
  AllData.tripOrder.push(tid);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(AllData));
  fbPushNewTrip(tid);
  switchTrip(tid);
  return tid;
}
function deleteTripById(tid){
  if(AllData.tripOrder.length<=1)return false;
  delete AllData.trips[tid];
  AllData.tripOrder=AllData.tripOrder.filter(function(x){return x!==tid;});
  if(activeTripId===tid)switchTrip(AllData.tripOrder[0]);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(AllData));
  fbDeleteTrip(tid);
  return true;
}
function renameTrip(tid,title){
  if(!AllData.trips[tid])return;
  AllData.trips[tid].meta.title=title;
  AllData.trips[tid].meta.updatedAt=new Date().toISOString();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(AllData));
  if(fbRef)fbRef.child('trips/'+tid+'/meta').update({title:title}).catch(function(e){console.error(e);});
}

/* 금액 입력칸: 천단위 콤마로 표시하되 실제 값은 콤마 없는 숫자 문자열로 저장 */
function formatMoneyStr(v){
  var s=String(v==null?'':v).replace(/[^\d.]/g,'');
  if(!s)return '';
  var dot=s.indexOf('.');
  var intPart=dot>-1?s.slice(0,dot):s;
  var decPart=dot>-1?s.slice(dot+1).replace(/\./g,''):'';
  intPart=intPart.replace(/^0+(?=\d)/,'');
  intPart=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return dot>-1?intPart+'.'+decPart:intPart;
}
function parseMoneyStr(v){return String(v==null?'':v).replace(/,/g,'');}
function cellMoney(td,obj,D,onDone){
  td.className='num';
  var box=el('div','money-cell');
  var i=el('input');i.type='text';i.inputMode='decimal';i.placeholder='0';
  i.value=obj.price==null||obj.price===''?'':formatMoneyStr(obj.price);
  i.addEventListener('input',function(){
    var raw=parseMoneyStr(i.value).replace(/[^\d.]/g,'');
    var firstDot=raw.indexOf('.');
    if(firstDot>-1)raw=raw.slice(0,firstDot+1)+raw.slice(firstDot+1).replace(/\./g,'');
    var oldLen=i.value.length;
    var oldCaret=i.selectionStart==null?oldLen:i.selectionStart;
    var formatted=formatMoneyStr(raw);
    i.value=formatted;
    var newCaret=Math.max(0,Math.min(formatted.length,oldCaret+(formatted.length-oldLen)));
    try{i.setSelectionRange(newCaret,newCaret);}catch(e){}
    obj.price=raw;if(onDone)onDone(false);
  });
  i.addEventListener('change',function(){
    var raw=parseMoneyStr(i.value);
    obj.price=raw;i.value=formatMoneyStr(raw);
    if(onDone)onDone(true);
  });
  var s=el('select');
  var lc=localCur(D);
  var opts=availableCurrencyCodes(D);
  if(!obj.priceCur)obj.priceCur=lc;
  if(opts.indexOf(obj.priceCur)<0)opts.push(obj.priceCur);
  opts.forEach(function(c){var n=el('option',null,c);n.value=c;
    if(obj.priceCur===c)n.selected=true;s.appendChild(n);});
  s.addEventListener('change',function(){obj.priceCur=s.value;if(onDone)onDone(true);});
  box.appendChild(i);box.appendChild(s);td.appendChild(box);
}

       '<input type="file" id="fImp" accept="application/json" hidden></div>'+
   '</div></div>';
  host.querySelector('#bXls').onclick=exportExcel;
  host.querySelector('#bExp').onclick=exportData;
  host.querySelector('#fImp').onchange=function(e){var f=e.target.files[0];if(f)importFile(f,function(){location.reload();});};
  host.querySelector('#bImp').onclick=function(){host.querySelector('#fImp').click();};
  updateSyncPill();
}

/* ===== 여행 선택 바 ===== */
/* 여행 이름(여행지, 시작일~종료일) 형태로 자동 표기 */
function tripDisplayName(t){
  var title=(t.meta&&t.meta.title)||'제목 없는 여행';
  var parts=[];
  if(t.meta&&t.meta.destination)parts.push(t.meta.destination);
  if(t.meta&&t.meta.startDate){
    parts.push(mmddFull(t.meta.startDate)+(t.meta.endDate?'~'+mmddFull(t.meta.endDate):''));
  }
  return parts.length?title+'('+parts.join(', ')+')':title;
}
function buildTripBar(host){
  host.innerHTML='';
  var bar=el('div','tripbar');
  var nameEl=el('div','tripbar-name');
  nameEl.innerHTML=ICON_PLANE+'<span>'+tripDisplayName(D)+'</span>';
  bar.appendChild(nameEl);
  bar.appendChild(el('div','tripbar-chev','여행 변경 ▾'));
  bar.onclick=openTripSwitcher;
  host.appendChild(bar);
}
function openTripSwitcher(){
  var backdrop=el('div','tl-backdrop');
  var ov=el('div','tl-editor');
  ov.appendChild(el('div','tl-editor-title','여행 선택'));

  var list=el('div','trip-list');
  AllData.tripOrder.forEach(function(tid){
    var t=AllData.trips[tid];if(!t)return;
    var row=el('div','trip-row'+(tid===activeTripId?' active':''));
    var nameWrap=el('div','trip-row-namewrap');
    var nameInp=el('input','trip-row-name');nameInp.type='text';
    nameInp.value=t.meta.title||'';nameInp.placeholder='제목 없는 여행';
    nameInp.addEventListener('click',function(e){e.stopPropagation();});
    nameInp.addEventListener('change',function(){renameTrip(tid,nameInp.value||'제목 없는 여행');});
    nameWrap.appendChild(nameInp);
    var capParts=[];
    if(t.meta.destination)capParts.push(t.meta.destination);
    if(t.meta.startDate)capParts.push(mmddFull(t.meta.startDate)+(t.meta.endDate?'~'+mmddFull(t.meta.endDate):''));
    if(capParts.length)nameWrap.appendChild(el('div','trip-row-cap',capParts.join(', ')));
    row.appendChild(nameWrap);
    var selBtn=el('button','trip-row-select',tid===activeTripId?'보는 중':'선택');
    if(tid===activeTripId)selBtn.disabled=true;
    selBtn.onclick=function(e){
      e.stopPropagation();
      switchTrip(tid);
      document.body.removeChild(backdrop);
      show((location.hash||'').replace('#','')||'summary');
    };
    row.appendChild(selBtn);
    var delBtn=el('button','trip-row-del','🗑');
    delBtn.onclick=function(e){
      e.stopPropagation();
      if(AllData.tripOrder.length<=1){alert('마지막 남은 여행은 삭제할 수 없어요.');return;}
      if(!confirm('"'+(t.meta.title||'제목 없는 여행')+'" 여행을 삭제할까요? 되돌릴 수 없습니다.'))return;
      var wasActive=(tid===activeTripId);
      deleteTripById(tid);
      document.body.removeChild(backdrop);
      if(wasActive)show((location.hash||'').replace('#','')||'summary');
      else openTripSwitcher();
    };
    row.appendChild(delBtn);
    list.appendChild(row);
  });
  ov.appendChild(list);

  var addRow=el('div','trip-add-row');
  var inp=el('input');inp.type='text';inp.placeholder='새 여행 이름 (예: 발리 가족여행)';
  addRow.appendChild(inp);
  var addBtn=el('button',null,'+ 추가');
  addBtn.onclick=function(){
    var title=inp.value.trim();
    if(!title){alert('여행 이름을 입력해주세요.');return;}
    addTrip(title);
    document.body.removeChild(backdrop);
    show('summary');
  };
  addRow.appendChild(addBtn);
  ov.appendChild(addRow);

  var closeBtn=el('button','btn-add ghost','닫기');
  closeBtn.style.marginTop='10px';
  closeBtn.onclick=function(){document.body.removeChild(backdrop);};
  ov.appendChild(closeBtn);

  backdrop.appendChild(ov);
  backdrop.addEventListener('click',function(e){if(e.target===backdrop)document.body.removeChild(backdrop);});
  document.body.appendChild(backdrop);
}

/* ===== 여행 설정 바 (여행지 / 통화 / 환율 / 기간) ===== */
var setbarOpen=false;
function setupBar(root,D,onRe){
  var box=el('div','setbar');

  var head=el('div','setbar-head');
  var titleWrap=el('div','setbar-title');
  titleWrap.appendChild(document.createTextNode('여행 설정'));
  var sumParts=[D.meta.destination||'여행지 미입력',localCur(D)];
  if(D.meta.startDate)sumParts.push(mmddFull(D.meta.startDate)+(D.meta.endDate?'~'+mmddFull(D.meta.endDate):''));
  titleWrap.appendChild(el('span','setbar-summary',sumParts.join(' · ')));
  head.appendChild(titleWrap);
  var swLabel=el('label','ios-switch');
  var swInp=el('input');swInp.type='checkbox';swInp.checked=setbarOpen;
  swLabel.appendChild(swInp);swLabel.appendChild(el('span','slider'));
  head.appendChild(swLabel);
  box.appendChild(head);

  var body=el('div','setbar-body'+(setbarOpen?'':' collapsed'));
  var g=el('div','setgrid');

  function sf(label,node){
    var w=el('div','sf');w.appendChild(el('label',null,label));w.appendChild(node);return w;
  }
  var dest=el('input');dest.type='text';dest.placeholder='예: 호주 케언즈';
  dest.value=D.meta.destination||'';
  dest.addEventListener('input',function(){D.meta.destination=dest.value;saveData(D,'meta');});
  dest.addEventListener('change',function(){
    var g2=guessCurrency(dest.value);
    if(g2&&g2!==D.meta.currency){
      D.meta.currency=g2;D.meta.rate=curInfo(g2).rate;
    }
    saveData(D,'meta');onRe();
  });

  var sd=el('input');sd.type='date';sd.value=D.meta.startDate||'';
  sd.addEventListener('change',function(){D.meta.startDate=sd.value;saveData(D,'meta');onRe();});
  var ed=el('input');ed.type='date';ed.value=D.meta.endDate||'';
  ed.addEventListener('change',function(){D.meta.endDate=ed.value;saveData(D,'meta');onRe();});

  var row3=el('div','sf-row3');
  var destSf=sf('여행지',dest);destSf.classList.add('sf-dest');
  row3.appendChild(destSf);
  row3.appendChild(sf('시작일',sd));
  row3.appendChild(sf('종료일',ed));
  g.appendChild(row3);

  var cur=el('select');
  CURRENCIES.forEach(function(c){
    var o=el('option',null,c.code+' · '+c.name);o.value=c.code;
    if(D.meta.currency===c.code)o.selected=true;cur.appendChild(o);
  });
  cur.addEventListener('change',function(){
    D.meta.currency=cur.value;D.meta.rate=curInfo(cur.value).rate;saveData(D,'meta');onRe();
  });

  var rate=el('input');rate.type='number';rate.step='0.001';rate.value=localRate(D);
  rate.addEventListener('change',function(){D.meta.rate=rate.value;saveData(D,'meta');onRe();});

  D.meta.extraCurrencies=D.meta.extraCurrencies||[];
  var curWrap=el('div','cur-field-wrap');
  curWrap.appendChild(cur);
  var addCurBtn=el('button','btn-addcur','+');
  addCurBtn.type='button';addCurBtn.title='화폐 추가';
  addCurBtn.onclick=function(){
    if(D.meta.extraCurrencies.length>=2){alert('화폐는 최대 2개까지 추가할 수 있습니다.');return;}
    var used={};used[localCur(D)]=true;used.KRW=true;
    D.meta.extraCurrencies.forEach(function(e){used[e.code]=true;});
    var next=CURRENCIES.filter(function(c){return !used[c.code];})[0];
    if(!next){alert('추가할 수 있는 화폐가 없습니다.');return;}
    D.meta.extraCurrencies.push({code:next.code,rate:next.rate});
    saveData(D,'meta');onRe();
  };
  curWrap.appendChild(addCurBtn);

  g.appendChild(sf('현지 통화',curWrap));
  g.appendChild(sf('환율 (1'+localCur(D)+'=원)',rate));

  D.meta.extraCurrencies.forEach(function(ex,exIdx){
    var exSel=el('select');
    CURRENCIES.forEach(function(c){
      var o=el('option',null,c.code+' · '+c.name);o.value=c.code;
      if(ex.code===c.code)o.selected=true;exSel.appendChild(o);
    });
    exSel.addEventListener('change',function(){
      ex.code=exSel.value;ex.rate=curInfo(ex.code).rate;saveData(D,'meta');onRe();
    });
    var exWrap=el('div','cur-field-wrap');
    exWrap.appendChild(exSel);
    var rmBtn=el('button','btn-rmcur','✕');
    rmBtn.type='button';rmBtn.title='이 화폐 삭제';
    rmBtn.onclick=function(){D.meta.extraCurrencies.splice(exIdx,1);saveData(D,'meta');onRe();};
    exWrap.appendChild(rmBtn);
    g.appendChild(sf('추가 통화 '+(exIdx+1),exWrap));

    var exRate=el('input');exRate.type='number';exRate.step='0.001';exRate.value=ex.rate;
    exRate.addEventListener('change',function(){ex.rate=exRate.value;saveData(D,'meta');onRe();});
    g.appendChild(sf('환율 (1'+ex.code+'=원)',exRate));
  });

  body.appendChild(g);
  box.appendChild(body);

  swInp.addEventListener('change',function(){
    setbarOpen=swInp.checked;
    body.classList.toggle('collapsed',!setbarOpen);
  });
  return box;
}


/* ===== 0. SUMMARY ===== */
function tabSummary(root,D){
  var re=function(){tabSummary(root,D);};
  root.innerHTML='';
  root.appendChild(setupBar(root,D,re));

  var dates=dateRange(D.meta.startDate,D.meta.endDate);
  root.appendChild(secHead('전체 요약',dates.length?dates.length+'일':''));
  if(!dates.length){root.appendChild(el('div','empty','시작일과 종료일을 입력해주세요.'));return;}

  var T=mkTable([{t:'일정',w:52},{t:'요약',w:130},{t:'호텔',w:100},{t:'이동',w:130},{t:'사용금액',w:138},{t:'비고',w:160}]);
  D.summaryNotes=D.summaryNotes||{};

  /* 항공·호텔·투어·렌트카·지출노트 5개 탭의 금액을 집계.
     항공/호텔/투어/렌트카는 보통 출발 전에 미리 결제하므로(지출노트 가져오기와 동일한 기준)
     실제 이용 날짜와 상관없이 항상 '출발전'으로 잡는다.
     지출노트에서 "가져오기"로 가져온 항목(impTab 있음)은 원본 탭에서 이미 집계되므로 제외해 중복계산을 막는다. */
  function assignDate(d){return (d&&dates.indexOf(d)>-1)?d:PRE_TRIP;}
  var costItems=[];
  (D.flights||[]).forEach(function(j){
    if(!j.price)return;
    costItems.push({date:PRE_TRIP,price:j.price,priceCur:j.priceCur});
  });
  groupHotelStays(D,dates).forEach(function(g){
    if(g.h.price)costItems.push({date:PRE_TRIP,price:g.h.price,priceCur:g.h.priceCur});
  });
  (D.tours||[]).forEach(function(t){
    if(!t.price)return;
    costItems.push({date:PRE_TRIP,price:t.price,priceCur:t.priceCur});
  });
  (D.rentalcar||[]).forEach(function(r){
    if(!r.price)return;
    costItems.push({date:PRE_TRIP,price:r.price,priceCur:r.priceCur});
  });
  (D.expenses||[]).forEach(function(e){
    if(e.impTab)return;
    if(!e.price)return;
    costItems.push({date:e.date===PRE_TRIP?PRE_TRIP:assignDate(e.date),price:e.price,priceCur:e.priceCur});
  });

  var byCur={};var curOrder=[];var grandK=0;
  costItems.forEach(function(c){
    grandK+=toKRW(c.price,c.priceCur,D);
    var v=Number(c.price)||0;if(!v)return;
    var cur=c.priceCur||localCur(D);
    if(!(cur in byCur))curOrder.push(cur);
    byCur[cur]=(byCur[cur]||0)+v;
  });

  dates.forEach(function(date,i){
    var itin=(D.itinerary||[]).filter(function(x){return x.date===date;})
      .sort(function(a,b){return (a.time||'').localeCompare(b.time||'');})
      .map(function(x){return (x.time?x.time+' ':'')+(x.activity||'');}).filter(Boolean);
    var hotel=(D.hotels||{})[date];
    var moves=[];
    (D.flights||[]).forEach(function(j){
      (j.segs||[]).forEach(function(s){
        if(s.date===date)moves.push('✈'+(s.from||'')+'→'+(s.to||''));
      });
    });
    (D.rentalcar||[]).forEach(function(r){if(r.date===date)moves.push('🚗'+(r.company||''));});
    (D.tours||[]).forEach(function(t){if(t.date===date)moves.push('🧭'+(t.tourName||''));});

    var dayK=0;
    costItems.forEach(function(c){if(c.date===date)dayK+=toKRW(c.price,c.priceCur,D);});

    var N=D.summaryNotes[date]=D.summaryNotes[date]||{summary:'',memo:''};
    var tr=el('tr');
    var goItin=function(){setUiTab('itin',date);show('itinerary');};
    var d0=el('td','rowhead');d0.style.cursor='pointer';
    d0.title='탭하면 일정 탭의 이 날짜로 이동';
    var dWk=wk(date);
    d0.innerHTML='<span class="'+wkClass(dWk)+'">'+mmdd(date)+'<br>('+dWk+')</span>';
    d0.addEventListener('click',goItin);
    tr.appendChild(d0);

    var itinText=itin.join('\n');
    var c1=el('td');var c1a=cellArea(c1,N,'summary',itinText||'요약',function(){saveData(D);});
    c1a.title='더블탭하면 일정 탭의 이 날짜로 이동';
    c1a.addEventListener('dblclick',goItin);
    if(!N.summary&&itin.length>1){
      setTimeout(function(){
        var savedVal=c1a.value;
        c1a.value=itinText;autoGrow(c1a);c1a.value=savedVal;
      },0);
    }
    tr.appendChild(c1);
    var c2=el('td');c2.appendChild(el('div',null,''));
    c2.firstChild.style.padding='8px 7px';c2.firstChild.style.fontSize='12.5px';
    c2.firstChild.textContent=hotel&&hotel.name?hotel.name:'-';tr.appendChild(c2);
    var c3=el('td');var mv=el('div');mv.style.padding='8px 7px';mv.style.fontSize='11.5px';
    mv.style.whiteSpace='pre-line';mv.textContent=moves.length?moves.join('\n'):'-';c3.appendChild(mv);tr.appendChild(c3);
    var c4=el('td','num');var mo=el('div');mo.style.padding='8px 7px';mo.style.fontSize='12px';
    mo.style.textAlign='right';mo.style.fontFamily='var(--mono)';
    mo.textContent=dayK?money(dayK)+'원':'-';c4.appendChild(mo);tr.appendChild(c4);
    var c5=el('td');cellArea(c5,N,'memo','비고',function(){saveData(D);});tr.appendChild(c5);

    T.tbody.appendChild(tr);
  });

  /* 하단 '출발전' 행: 사전 결제한 항공/호텔/투어/렌트카 + 출발전 날짜의 지출노트 항목을 모아 보여준다 */
  var preK=0;
  costItems.forEach(function(c){if(c.date===PRE_TRIP)preK+=toKRW(c.price,c.priceCur,D);});
  var preItems=[];
  (D.flights||[]).forEach(function(j){if(j.price)preItems.push('✈'+(j.agency||'항공권'));});
  groupHotelStays(D,dates).forEach(function(g){if(g.h.price)preItems.push('🏨'+(g.h.name||'호텔'));});
  (D.tours||[]).forEach(function(t){if(t.price)preItems.push('🧭'+(t.tourName||'투어'));});
  (D.rentalcar||[]).forEach(function(r){if(r.price)preItems.push('🚗'+(r.company||'렌트카'));});
  (D.expenses||[]).forEach(function(e){
    if(e.date===PRE_TRIP&&!e.impTab&&(e.item||e.cat))preItems.push(e.item||e.cat);
  });
  var preTr=el('tr');
  var goExp=function(){setUiTab('expense',PRE_TRIP);show('expenses');};
  var pd0=el('td','rowhead');pd0.style.cursor='pointer';pd0.title='탭하면 지출노트의 출발전 탭으로 이동';
  pd0.textContent='출발전';pd0.addEventListener('click',goExp);
  preTr.appendChild(pd0);
  var pc1=el('td');var pc1d=el('div');pc1d.style.cssText='padding:8px 7px;font-size:12.5px;white-space:pre-line;';
  pc1d.textContent=preItems.length?preItems.join('\n'):'-';pc1.appendChild(pc1d);preTr.appendChild(pc1);
  var pc2=el('td');var pc2d=el('div');pc2d.style.cssText='padding:8px 7px;font-size:12.5px;';pc2d.textContent='-';pc2.appendChild(pc2d);preTr.appendChild(pc2);
  var pc3=el('td');var pc3d=el('div');pc3d.style.cssText='padding:8px 7px;font-size:11.5px;';pc3d.textContent='-';pc3.appendChild(pc3d);preTr.appendChild(pc3);
  var pc4=el('td','num');var pc4d=el('div');pc4d.style.cssText='padding:8px 7px;font-size:12px;text-align:right;font-family:var(--mono);';
  pc4d.textContent=preK?money(preK)+'원':'-';pc4.appendChild(pc4d);preTr.appendChild(pc4);
  preTr.appendChild(el('td'));
  T.tbody.appendChild(preTr);

  root.appendChild(T.wrap);
  scrollHint(T.wrap);
  var curParts=curOrder.map(function(c){return c==='KRW'?money(byCur[c])+'원':curInfo(c).sym+money(byCur[c]);});
  root.appendChild(totalBar('전체 사용금액',money(grandK)+'원',curParts.length?'통화별: '+curParts.join(' + '):''));
}

/* ===== 1. 일정 ===== */
var TL_PX=60; /* 1시간 = 60px (1분 = 1px) */
/* 내용이 여러 줄이면 블록 높이를 내용에 맞게 늘려서, 줄바꿈한 내용이 가려지지 않고 다 보이게 한다 */
function resizeBlockForContent(blk){
  var act=blk.querySelector('.tl-activity');
  if(act){act.style.height='auto';act.style.height=act.scrollHeight+'px';}
  var needed=blk.scrollHeight;
  var curH=parseFloat(blk.style.height)||0;
  if(needed>curH)blk.style.height=needed+'px';
}
function timeToMin(t){if(!t)return null;var p=String(t).split(':');var h=+p[0],m=+p[1]||0;
  if(isNaN(h))return null;return h*60+m;}
function minToTime(m){m=Math.max(0,Math.min(1439,Math.round(m)));
  var h=Math.floor(m/60),mm=m%60;
  return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;}

function tabItinerary(root,D){
  var re=function(){tabItinerary(root,D);};
  root.innerHTML='';
  root.appendChild(setupBar(root,D,re));

  var dates=dateRange(D.meta.startDate,D.meta.endDate);
  root.appendChild(secHead('타임테이블',dates.length?dates.length+'일':''));
  if(!dates.length){root.appendChild(el('div','empty','기간을 입력하면 날짜별 타임테이블이 만들어집니다.'));return;}

  var selDate=getUiTab('itin',dates);

  var pills=el('div','daypills');
  dates.forEach(function(date,i){
    var b=el('button','daypill'+(date===selDate?' active':''));
    var bWk=wk(date);
    b.innerHTML='<span class="'+wkClass(bWk)+'">'+mmdd(date)+'</span>';
    b.onclick=function(){setUiTab('itin',date);re();};
    pills.appendChild(b);
  });
  root.appendChild(pills);

  var items=D.itinerary.filter(function(x){return x.date===selDate;});

  var undated=items.filter(function(x){return timeToMin(x.time)==null;});
  if(undated.length){
    var uw=el('div','tl-undated');
    uw.appendChild(el('div','tl-undated-label','⏱ 시간 미정 (버튼으로 시간 지정)'));
    undated.forEach(function(item){
      var row=el('div','tl-undated-item');
      var txt=el('input');txt.type='text';txt.placeholder='내용';txt.value=item.activity||'';
      txt.addEventListener('input',function(){item.activity=txt.value;saveData(D);});
      row.appendChild(txt);
      var setT=el('button',null,'시간 지정');
      setT.onclick=function(){openTimeEditor(D,item,re);};
      row.appendChild(setT);
      var del=el('button',null,'✕');
      del.onclick=function(){var q=D.itinerary.indexOf(item);if(q>-1){D.itinerary.splice(q,1);saveData(D);re();}};
      row.appendChild(del);
      uw.appendChild(row);
    });
    root.appendChild(uw);
  }

  root.appendChild(buildTimeline(D,selDate,items,re));
  Array.prototype.forEach.call(root.querySelectorAll('.tl-item'),resizeBlockForContent);
}

function buildTimeline(D,date,items,re){
  var wrap=el('div','tl-wrap');
  var scroll=el('div','tl-scroll');
  var inner=el('div','tl-inner');
  inner.style.height=(24*TL_PX)+'px';

  for(var h=0;h<24;h++){
    var top=h*TL_PX;
    var line=el('div','tl-hour-line');line.style.top=top+'px';
    inner.appendChild(line);
    var lab=el('div','tl-hour-label',(h<10?'0':'')+h+':00');lab.style.top=(top-6)+'px';
    inner.appendChild(lab);
  }

  items.forEach(function(item){
    var st=timeToMin(item.time);
    if(st==null)return;
    var en=item.endTime!=null&&item.endTime!==''?timeToMin(item.endTime):st+30;
    if(en==null||en<=st)en=st+15;
    inner.appendChild(buildBlock(D,item,st,en,re));
  });

  inner.addEventListener('dblclick',function(e){
    if(e.target!==inner)return;
    var rect=inner.getBoundingClientRect();
    var y=e.clientY-rect.top;
    var st=Math.max(0,Math.min(1410,Math.round(y/15)*15));
    var en=st+30;
    var it={id:uid(),date:date,time:minToTime(st),endTime:minToTime(en),activity:'',memo:''};
    D.itinerary.push(it);
    saveData(D);re();
    setTimeout(function(){
      var box=document.querySelector('[data-iid="'+it.id+'"] .tl-activity');
      if(box)box.focus();
    },60);
  });

  scroll.appendChild(inner);
  wrap.appendChild(scroll);
  setTimeout(function(){scroll.scrollTop=6*TL_PX;},30);
  return wrap;
}

function buildBlock(D,item,st,en,re){
  var blk=el('div','tl-item');
  blk.setAttribute('data-iid',item.id);
  blk.style.top=st+'px';
  blk.style.height=Math.max(24,en-st)+'px';

  var timeLbl=el('div','tl-time',minToTime(st)+'–'+minToTime(en));
  blk.appendChild(timeLbl);

  var act=el('textarea','tl-activity');act.rows=1;act.placeholder='내용 입력';act.value=item.activity||'';
  act.addEventListener('input',function(){item.activity=act.value;saveData(D);resizeBlockForContent(blk);});
  act.addEventListener('click',function(e){e.stopPropagation();});
  act.addEventListener('keydown',function(e){e.stopPropagation();});
  blk.appendChild(act);

  var del=el('button','tl-del','✕');
  del.onclick=function(e){e.stopPropagation();var q=D.itinerary.indexOf(item);if(q>-1){D.itinerary.splice(q,1);saveData(D);re();}};
  blk.appendChild(del);

  var handleTop=el('div','tl-handle tl-handle-top','⋮⋮');
  blk.appendChild(handleTop);

  var draggingTop=false,startYTop=0,startSt=st,pendingSt=st;
  handleTop.addEventListener('pointerdown',function(e){
    e.stopPropagation();e.preventDefault();
    draggingTop=true;startYTop=e.clientY;startSt=st;pendingSt=st;
    try{handleTop.setPointerCapture(e.pointerId);}catch(err){}
  });
  handleTop.addEventListener('pointermove',function(e){
    if(!draggingTop)return;
    var dy=e.clientY-startYTop;
    var newSt=Math.round((startSt+dy)/5)*5;
    newSt=Math.max(0,Math.min(en-15,newSt));
    pendingSt=newSt;
    blk.style.top=newSt+'px';
    blk.style.height=(en-newSt)+'px';
    timeLbl.textContent=minToTime(newSt)+'–'+minToTime(en);
  });
  function finishDragTop(){
    if(!draggingTop)return;
    draggingTop=false;
    item.time=minToTime(pendingSt);
    saveData(D);re();
  }
  handleTop.addEventListener('pointerup',finishDragTop);
  handleTop.addEventListener('pointercancel',finishDragTop);

  var handle=el('div','tl-handle','⋮⋮');
  blk.appendChild(handle);

  var dragging=false,startY=0,startEn=en,pendingEn=en;
  handle.addEventListener('pointerdown',function(e){
    e.stopPropagation();e.preventDefault();
    dragging=true;startY=e.clientY;startEn=en;pendingEn=en;
    try{handle.setPointerCapture(e.pointerId);}catch(err){}
  });
  handle.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var dy=e.clientY-startY;
    var newEn=Math.round((startEn+dy)/5)*5;
    newEn=Math.max(st+15,Math.min(1440,newEn));
    pendingEn=newEn;
    blk.style.height=(newEn-st)+'px';
    timeLbl.textContent=minToTime(st)+'–'+minToTime(newEn);
  });
  function finishDrag(){
    if(!dragging)return;
    dragging=false;
    item.endTime=minToTime(pendingEn);
    saveData(D);re();
  }
  handle.addEventListener('pointerup',finishDrag);
  handle.addEventListener('pointercancel',finishDrag);

  blk.addEventListener('dblclick',function(e){e.stopPropagation();openTimeEditor(D,item,re);});

  return blk;
}

function openTimeEditor(D,item,re){
  var backdrop=el('div','tl-backdrop');
  var ov=el('div','tl-editor');
  var st=timeToMin(item.time);if(st==null)st=8*60;
  var en=item.endTime!=null&&item.endTime!==''?timeToMin(item.endTime):st+30;
  if(en==null||en<=st)en=st+30;

  function numSel(max,val,onchange){
    var s=el('select');
    for(var i=0;i<max;i++){var o=el('option',null,(i<10?'0':'')+i);o.value=i;if(i===val)o.selected=true;s.appendChild(o);}
    s.addEventListener('change',function(){onchange(Number(s.value));});
    return s;
  }

  ov.appendChild(el('div','tl-editor-title','시간 · 메모 수정'));

  var row1=el('div','tl-editor-row');
  row1.appendChild(el('span',null,'시작'));
  row1.appendChild(numSel(24,Math.floor(st/60),function(v){st=v*60+(st%60);}));
  row1.appendChild(el('span',null,':'));
  row1.appendChild(numSel(60,st%60,function(v){st=Math.floor(st/60)*60+v;}));
  ov.appendChild(row1);

  var row2=el('div','tl-editor-row');
  row2.appendChild(el('span',null,'종료'));
  row2.appendChild(numSel(25,Math.floor(en/60),function(v){en=v*60+(en%60);}));
  row2.appendChild(el('span',null,':'));
  row2.appendChild(numSel(60,en%60,function(v){en=Math.floor(en/60)*60+v;}));
  ov.appendChild(row2);

  var actInp=el('input');actInp.type='text';actInp.placeholder='내용';actInp.value=item.activity||'';
  actInp.style.cssText='width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-size:13px;margin-bottom:10px;';
  ov.appendChild(actInp);

  var memoInp=el('textarea');memoInp.rows=2;memoInp.placeholder='메모';memoInp.value=item.memo||'';
  ov.appendChild(memoInp);

  var btnRow=el('div','tl-editor-btns');
  var saveBtn=el('button',null,'저장');
  saveBtn.onclick=function(){
    if(en<=st)en=st+15;
    item.time=minToTime(st);item.endTime=minToTime(en);
    item.activity=actInp.value;item.memo=memoInp.value;
    saveData(D);document.body.removeChild(backdrop);re();
  };
  var cancelBtn=el('button',null,'취소');
  cancelBtn.onclick=function(){document.body.removeChild(backdrop);};
  btnRow.appendChild(cancelBtn);btnRow.appendChild(saveBtn);
  ov.appendChild(btnRow);

  backdrop.appendChild(ov);
  backdrop.addEventListener('click',function(e){if(e.target===backdrop)document.body.removeChild(backdrop);});
  document.body.appendChild(backdrop);
}

/* ===== 2. 항공 ===== */
function blankSeg(D){return{id:uid(),date:(D&&D.meta&&D.meta.startDate)||'',time:'',arriveTime:'',airline:'',flightNo:'',from:'',to:''};}
/* 항공 탭·항공 비교표에 이미 입력된 출발지/도착지를 모아 datalist로 제공 (새로 타이핑 안 해도 골라 쓸 수 있게) */
function airportOptions(D){
  var set={};
  (D.flights||[]).forEach(function(j){(j.segs||[]).forEach(function(s){if(s.from)set[s.from]=true;if(s.to)set[s.to]=true;});});
  (D.flightCompare||[]).forEach(function(j){(j.segs||[]).forEach(function(s){if(s.from)set[s.from]=true;if(s.to)set[s.to]=true;});});
  return Object.keys(set).sort();
}
function buildAirportDatalist(D,id){
  var dl=el('datalist');dl.id=id;
  airportOptions(D).forEach(function(v){var o=el('option');o.value=v;dl.appendChild(o);});
  return dl;
}
function tabFlights(root,D){
  var re=function(){tabFlights(root,D);};
  root.innerHTML='';
  root.appendChild(setupBar(root,D,re));
  root.appendChild(secHead('항공',D.flights.length+'건'));
  root.appendChild(buildAirportDatalist(D,'airport-dl'));

  var journeys=D.flights.slice().sort(function(a,b){
    var da=(a.segs&&a.segs[0]&&a.segs[0].date)||'';
    var db=(b.segs&&b.segs[0]&&b.segs[0].date)||'';
    return da.localeCompare(db);
  });

  var T=mkTable([
    {t:'여정',w:55},{t:'날짜',w:112},{t:'출발',w:74},{t:'도착',w:74},
    {t:'항공사',w:66},{t:'편명',w:56},{t:'출발지',w:90},{t:'도착지',w:90},
    {t:'예약처',w:66},{t:'금액',w:120},{t:'결제',w:58},{t:'비고',w:186},{t:'',w:32}]);

  journeys.forEach(function(j){
    j.segs=(j.segs&&j.segs.length)?j.segs:[blankSeg(D)];
    var span=j.segs.length;
    j.segs.forEach(function(s,si){
      var tr=el('tr');
      var sv=function(full){saveData(D);if(full)re();};
      function td(cls){var c=el('td',cls);tr.appendChild(c);return c;}

      var ct=td();
      var tt=el('select');
      ['왕복','편도'].forEach(function(o){var op=el('option',null,o);op.value=o;
        if((j.tripType||'왕복')===o)op.selected=true;tt.appendChild(op);});
      tt.addEventListener('change',function(){
        j.tripType=tt.value;
        if(j.tripType==='왕복'){
          while(j.segs.length<2)j.segs.push(blankSeg(D));
        }else if(j.tripType==='편도'&&j.segs.length>1){
          if(confirm('편도로 바꾸면 두 번째 구간부터는 삭제됩니다. 계속할까요?')){
            j.segs=[j.segs[0]];
          }else{
            j.tripType='왕복';tt.value='왕복';
          }
        }
        saveData(D);re();
      });
      ct.appendChild(tt);

      /* 왕복일 때 가는편(si===0)의 항공사/출발지/도착지를 입력하면 오는편(비어있는 칸만) 자동 채움 */
      var svAirline=function(full){
        if(full&&si===0&&j.tripType==='왕복'&&j.segs[1]&&!j.segs[1].airline)j.segs[1].airline=s.airline;
        sv(full);
      };
      var svFrom=function(full){
        if(full&&si===0&&j.tripType==='왕복'&&j.segs[1]&&!j.segs[1].to)j.segs[1].to=s.from;
        sv(full);
      };
      var svTo=function(full){
        if(full&&si===0&&j.tripType==='왕복'&&j.segs[1]&&!j.segs[1].from)j.segs[1].from=s.to;
        sv(full);
      };
      cellInput(td(),s,'date','date',null,sv);
      cellInput(td(),s,'time','time',null,sv);
      cellInput(td(),s,'arriveTime','time',null,sv);
      cellInput(td(),s,'airline','text','항공사',si===0?svAirline:sv);
      cellInput(td(),s,'flightNo','text','KE407',sv);
      cellInput(td(),s,'from','text','출발지',si===0?svFrom:sv).setAttribute('list','airport-dl');
      cellInput(td(),s,'to','text','도착지',si===0?svTo:sv).setAttribute('list','airport-dl');

      /* 예약처·금액·결제·비고는 여정당 한 번만(rowspan) — 반복 입력으로 인한 중복 입력 방지 */
      if(si===0){
        var ca=el('td');ca.rowSpan=span;cellInput(ca,j,'agency','text','예약처',sv);tr.appendChild(ca);
        var cm=el('td');cm.rowSpan=span;cellMoney(cm,j,D,sv);tr.appendChild(cm);
        var cp=el('td');cp.rowSpan=span;cellSelect(cp,j,'payment',PAY_OPTS,sv);tr.appendChild(cp);
        var cn=el('td');cn.rowSpan=span;cellInput(cn,j,'memo','text','비고',sv);tr.appendChild(cn);
      }

      delCell(tr,function(){
        if(j.segs.length>1){j.segs.splice(si,1);saveData(D);re();}
        else if(confirm('이 여정을 삭제할까요?')){
          var idx=D.flights.indexOf(j);if(idx>-1){D.flights.splice(idx,1);saveData(D);re();}
        }
      });
      T.tbody.appendChild(tr);
    });

    var addTr=el('tr');
    var addTd=el('td');addTd.colSpan=13;
    var addBtn=el('button',null,'+ 이 여정에 구간 추가 (경유·귀국편 등)');
    addBtn.style.cssText='width:100%;padding:7px;font-size:11.5px;color:var(--navy);';
    addBtn.onclick=function(){j.segs.push(blankSeg(D));saveData(D);re();};
    addTd.appendChild(addBtn);addTr.appendChild(addTd);
    T.tbody.appendChild(addTr);
  });

  root.appendChild(T.wrap);
  scrollHint(T.wrap);

  var add=el('button','btn-add','+ 항공 여정 추가');
  add.onclick=function(){
    D.flights.push({id:uid(),tripType:'왕복',agency:'',price:'',priceCur:localCur(D),payment:'카드',memo:'',segs:[blankSeg(D),blankSeg(D)]});
    saveData(D);re();
  };
  root.appendChild(add);
  root.appendChild(sumBar('항공 비용 합계',D.flights,D));

  var b2=el('button','btn-wide','✈ 항공 비교하기');
  b2.onclick=function(){location.href='DATA/pages/flight-compare.html';};
  root.appendChild(b2);
}

/* 금액 합계 바 (현지통화 + 원화) */
function sumBar(label,arr,D){
  var k=0;var byCur={};var order=[];
  arr.forEach(function(x){
    k+=toKRW(x.price,x.priceCur,D);
    var v=Number(x.price)||0;
    if(!v)return;
    var c=x.priceCur||localCur(D);
    if(!(c in byCur))order.push(c);
    byCur[c]=(byCur[c]||0)+v;
  });
  var parts=order.map(function(c){
    return c==='KRW'?money(byCur[c])+'원':curInfo(c).sym+money(byCur[c]);
  });
  return totalBar(label,money(k)+'원',parts.length?'입력 원본: '+parts.join(' + '):'');
}

/* ===== 3. 호텔 ===== */
function blankHotelNight(D){return{name:'',place:'',agency:'',price:'',priceCur:localCur(D),payment:'카드',memo:''};}
function hotelNightSig(h){return [h.name,h.place,h.agency,h.price,h.priceCur,h.payment,h.memo].join('||');}
/* 연속된 날짜 중 같은 내용(호텔명·장소·예약처·금액·결제·비고)이면 체크인~체크아웃 한 건으로 묶는다.
   금액은 밤마다 복제 저장되어 있으므로, 합산·가져오기 등에서는 반드시 그룹당 1건으로만 계산해야 한다. */
function groupHotelStays(D,dates){
  var groups=[];var cur=null;
  dates.forEach(function(date){
    var h=(D.hotels||{})[date]||blankHotelNight(D);
    var sig=hotelNightSig(h);
    if(cur&&cur.sig===sig){cur.last=date;cur.nights.push(date);}
    else{cur={sig:sig,first:date,last:date,nights:[date],h:h};groups.push(cur);}
  });
  return groups;
}
function tabHotels(root,D){
  var re=function(){tabHotels(root,D);};
  root.innerHTML='';
  root.appendChild(setupBar(root,D,re));
  var dates=dateRange(D.meta.startDate,D.meta.endDate);
  root.appendChild(secHead('호텔',dates.length?dates.length+'박':''));
  if(!dates.length){root.appendChild(el('div','empty','여행 기간을 먼저 입력해주세요.'));return;}

  D.hotels=D.hotels||{};
  dates.forEach(function(date){D.hotels[date]=D.hotels[date]||blankHotelNight(D);});

  var groups=groupHotelStays(D,dates);

  /* 체크인/체크아웃 날짜를 바꿔서 그룹의 숙박 범위를 다시 설정 (제외된 날짜는 비움) */
  function applyRange(g,newFirst,newLast){
    var newNights=dateRange(newFirst,newLast).filter(function(d){return dates.indexOf(d)>-1;});
    if(!newNights.length)return false;
    var content={};for(var k in g.h)content[k]=g.h[k];
    g.nights.forEach(function(d){if(newNights.indexOf(d)<0)D.hotels[d]=blankHotelNight(D);});
    newNights.forEach(function(d){var n={};for(var k in content)n[k]=content[k];D.hotels[d]=n;});
    return true;
  }

  var T=mkTable([{t:'체크인',w:112},{t:'체크아웃',w:112},{t:'호텔명',w:168},{t:'장소',w:88},{t:'예약처',w:90},
                 {t:'금액',w:120},{t:'결제',w:58},{t:'비고',w:150},{t:'',w:32}]);
  var list=[];
  groups.forEach(function(g){
    var h=g.h;
    list.push(h);
    var tr=el('tr');
    var s=function(full){
      g.nights.forEach(function(d){if(D.hotels[d]!==h){for(var k in h)D.hotels[d][k]=h[k];}});
      saveData(D);if(full)re();
    };
    function td(cls){var c=el('td',cls);tr.appendChild(c);return c;}

    var ci=el('input');ci.type='date';ci.value=g.first;
    ci.addEventListener('change',function(){
      if(!ci.value||!applyRange(g,ci.value,g.last)){alert('여행 기간과 겹치는 날짜를 입력해주세요.');ci.value=g.first;return;}
      saveData(D);re();
    });
    var tdCi=el('td');tdCi.appendChild(ci);tr.appendChild(tdCi);

    var co=el('input');co.type='date';co.value=nextDay(g.last);
    co.addEventListener('change',function(){
      var newLast=co.value?dayBefore(co.value):g.last;
      if(!applyRange(g,g.first,newLast)){alert('여행 기간과 겹치는 날짜를 입력해주세요.');co.value=nextDay(g.last);return;}
      saveData(D);re();
    });
    var tdCo=el('td');tdCo.appendChild(co);tr.appendChild(tdCo);

    cellInput(td(),h,'name','text','호텔명',s);
    cellInput(td(),h,'place','text','장소',s);
    cellInput(td(),h,'agency','text','예약처',s);
    cellMoney(td(),h,D,s);
    cellSelect(td(),h,'payment',PAY_OPTS,s);
    cellInput(td(),h,'memo','text','비고',s);

    delCell(tr,function(){
      if(confirm('이 숙박 정보를 지울까요?')){
        g.nights.forEach(function(d){D.hotels[d]=blankHotelNight(D);});
        saveData(D);re();
      }
    });

    T.tbody.appendChild(tr);
  });
  root.appendChild(T.wrap);
  scrollHint(T.wrap);
  root.appendChild(sumBar('호텔 비용 합계',list,D));

  var b2=el('button','btn-wide','🏨 호텔 비교하기');
  b2.onclick=function(){location.href='DATA/pages/hotel-compare.html';};
  root.appendChild(b2);
}

/* ===== 5. 지출노트 ===== */
var PRE_TRIP='__pre__';
/* 항공/호텔/투어/렌트카 탭에 입력된 금액을 지출노트로 가져오기 위한 후보 목록.
   여행 기간에 속한 날짜면 그 날짜로, 아니면(또는 날짜 미정이면) '출발전'으로 자동 배정한다. */
/* 항공/호텔/투어/렌트카는 보통 출발 전에 미리 결제하므로(실제 이용일과 지출일이 다름),
   지출노트로 가져올 땐 실제 이용 날짜와 상관없이 항상 '출발전'으로 분류한다. */
function collectImportableExpenses(D,dates){
  var out=[];
  (D.flights||[]).forEach(function(j){
    if(!j.price)return;
    out.push({impTab:'flights',impId:j.id,date:PRE_TRIP,cat:'항공권',
      item:'항공권'+(j.agency?' ('+j.agency+')':''),price:j.price,priceCur:j.priceCur,payment:j.payment||'카드',memo:j.memo||''});
  });
  groupHotelStays(D,dates).forEach(function(g){
    if(g.h.price){
      out.push({impTab:'hotels',impId:g.first,date:PRE_TRIP,cat:'숙박비',
        item:'호텔'+(g.h.name?' ('+g.h.name+')':''),price:g.h.price,priceCur:g.h.priceCur,payment:g.h.payment||'카드',memo:g.h.memo||''});
    }
  });
  (D.tours||[]).forEach(function(t){
    if(!t.price)return;
    out.push({impTab:'tours',impId:t.id,date:PRE_TRIP,cat:'관광/입장료',
      item:'투어'+(t.tourName?' ('+t.tourName+')':''),price:t.price,priceCur:t.priceCur,payment:t.payment||'카드',memo:t.memo||''});
  });
  (D.rentalcar||[]).forEach(function(r){
    if(!r.price)return;
    out.push({impTab:'rentalcar',impId:r.id,date:PRE_TRIP,cat:'교통',
      item:'렌트카'+(r.company?' ('+r.company+')':''),price:r.price,priceCur:r.priceCur,payment:r.payment||'카드',memo:r.memo||''});
  });
  return out;
}
/* impTab/impId로 가져온 지출 항목의 원본이 아직 해당 탭에 남아있는지 확인 (삭제됐으면 false) */
function importedSourceExists(D,impTab,impId){
  if(impTab==='flights')return (D.flights||[]).some(function(j){return j.id===impId;});
  if(impTab==='hotels'){var h=(D.hotels||{})[impId];return !!(h&&h.price);}
  if(impTab==='tours')return (D.tours||[]).some(function(t){return t.id===impId;});
  if(impTab==='rentalcar')return (D.rentalcar||[]).some(function(r){return r.id===impId;});
  return true;
}
function tabExpenses(root,D){
  var re=function(){tabExpenses(root,D);};

  var dates=dateRange(D.meta.startDate,D.meta.endDate);

  var impBtn=el('button','btn-add ghost','📥 항공·호텔·렌트카·투어 값 가져오기');
  impBtn.onclick=function(){
    var existing={};
    D.expenses.forEach(function(e){if(e.impTab)existing[e.impTab+'::'+e.impId]=true;});
    var candidates=collectImportableExpenses(D,dates);
    var added=0;
    candidates.forEach(function(c){
      var key=c.impTab+'::'+c.impId;
      if(existing[key])return;
      D.expenses.push({id:uid(),date:c.date,cat:c.cat,item:c.item,price:c.price,priceCur:c.priceCur,
        payment:c.payment,memo:c.memo,impTab:c.impTab,impId:c.impId});
      added++;

    var removed=0;
    for(var i=D.expenses.length-1;i>=0;i--){
      var e=D.expenses[i];
      if(e.impTab&&!importedSourceExists(D,e.impTab,e.impId)){D.expenses.splice(i,1);removed++;}
    }
    if(!added&&!removed){alert('가져올 새 항목이 없습니다. (이미 모두 가져왔거나, 항공/호텔/투어/렌트카 탭에 입력된 금액이 없습니다)');return;}
    saveData(D);re();

    if(removed)msg.push(removed+'건은 원본이 삭제되어 지출노트에서도 삭제했습니다');
    alert(msg.join(', ')+'. (출발전/여행중 날짜가 자동으로 배정됩니다)');

    b.onclick=function(){setUiTab('expense',date);re();};

  root.appendChild(pills);

  var items=D.expenses.filter(function(e){return e.date===selDate;});
  var displayItems=items.slice().sort(function(a,b){
    var ai=EXP_CATS.indexOf(a.cat);if(ai<0)ai=EXP_CATS.length;
    var bi=EXP_CATS.indexOf(b.cat);if(bi<0)bi=EXP_CATS.length;
    return ai-bi;
  });
  var catColorMap={};var pi=0;
  displayItems.forEach(function(item){
    var cat=(item.cat||'').trim();
    if(cat&&!(cat in catColorMap)){catColorMap[cat]=RECORD_CAT_PALETTE[pi%RECORD_CAT_PALETTE.length];pi++;}
  });
  var prevCat;
  var T=mkTable([{t:'No',w:34},{t:'카테고리',w:88},{t:'사용내역',w:165},{t:'금액',w:120},{t:'결제',w:58},{t:'비고',w:195},{t:'',w:32}]);
  var dayK=0;
  displayItems.forEach(function(item,idx){
    dayK+=toKRW(item.price,item.priceCur,D);
    var tr=el('tr');
    var cat=(item.cat||'').trim();

    prevCat=cat;
    if(cat&&catColorMap[cat]){tr.classList.add('cat-tinted');tr.style.setProperty('--cat-bg',catColorMap[cat]);}
    var no=el('td','rowhead',String(idx+1));tr.appendChild(no);

    function td(cls){var c=el('td',cls);tr.appendChild(c);return c;}
    cellSelect(td(),item,'cat',EXP_CATS,s);

    delCell(tr,function(){var q=D.expenses.indexOf(item);if(q>-1){D.expenses.splice(q,1);saveData(D);re();}});
    T.tbody.appendChild(tr);
  });
  root.appendChild(T.wrap);
  scrollHint(T.wrap);

  var add=el('button','btn-add','+ 지출 추가');
  add.onclick=function(){
    D.expenses.push({id:uid(),date:selDate,cat:EXP_CATS[0],item:'',price:'',priceCur:localCur(D),payment:'카드',memo:''});
    saveData(D);re();

/* 링크/이미지 기록 - 이미지를 Firebase Storage에 올리고 가족 모두가 볼 수 있는 링크(imageUrl)를 저장 */
function startRecordUpload(item,f,ic,re){
  if(!fbStorage){alert('이미지 업로드 기능을 사용할 수 없습니다.\nFirebase Storage 설정이 필요합니다 (README 참고).');return;}
  if(f.size>10*1024*1024){alert('이미지 용량이 너무 큽니다. 10MB 이하 파일만 올릴 수 있어요.');return;}
  ic.innerHTML='';
  var prog=el('div',null,'업로드 중... 0%');
  prog.style.cssText='padding:8px 7px;font-size:10.5px;color:var(--muted);';
  ic.appendChild(prog);
  var path='records/'+uid()+'_'+f.name;
  var task=fbStorage.ref().child(path).put(f);
  task.on('state_changed',function(snap){
    var pct=Math.round((snap.bytesTransferred/snap.totalBytes)*100);
    prog.textContent='업로드 중... '+pct+'%';
  },function(err){
    console.error(err);
    alert('이미지 업로드에 실패했습니다: '+err.message);
    re();
  },function(){
    task.snapshot.ref.getDownloadURL().then(function(url){
      item.imageFile=f.name;item.imageUrl=url;item.imagePath=path;
      saveData(D);re();
    });
  });
}

var RECORD_CAT_PALETTE=['#EAF3FB','#EAF7EE','#FDF3E4','#F5EEFB','#FDEAF0','#EAFBF7','#F7F3E4','#F3F0F5'];
function tabRecords(root,D,key,title){

    var ac=(a.category||'').trim(),bc=(b.category||'').trim();
    if(!ac&&!bc)return 0;

    if(!bc)return -1;
    return ac.localeCompare(bc);
  });
  var catColorMap={};var pi=0;
  displayArr.forEach(function(item){
    var cat=(item.category||'').trim();
    if(cat&&!(cat in catColorMap)){catColorMap[cat]=RECORD_CAT_PALETTE[pi%RECORD_CAT_PALETTE.length];pi++;}
  });
  var prevCat;

  displayArr.forEach(function(item,idx){
    var tr=el('tr');
    var s=function(full){saveData(D);if(full)re();};

    cellInput(td(),item,'link','text','https://...',s);

    var ic=el('td');
    if(item.imageUrl){
      var ia=el('a',null,'🖼 '+(item.imageFile||'이미지 열기'));
      ia.href=item.imageUrl;ia.target='_blank';
      ia.style.cssText='display:block;padding:8px 7px;font-size:11.5px;color:var(--green);text-decoration:underline;word-break:break-all;';
      ic.appendChild(ia);
      var rm=el('button',null,'파일 변경');
      rm.style.cssText='display:block;width:100%;padding:4px;font-size:10px;color:var(--muted);';
      rm.onclick=function(){
        if(item.imagePath&&fbStorage)fbStorage.ref().child(item.imagePath).delete().catch(function(){});
        item.imageFile='';item.imageUrl='';item.imagePath='';saveData(D);re();
      };
      ic.appendChild(rm);
    }else{
      if(item.imageFile){
        var warn=el('div',null,'⚠ '+item.imageFile+' (다시 올려주세요)');
        warn.style.cssText='padding:6px 7px 2px;font-size:10px;color:var(--red);word-break:break-all;';
        ic.appendChild(warn);
      }
      var fi=el('input');fi.type='file';fi.accept='image/*';
      fi.style.cssText='padding:6px 5px;font-size:10.5px;';
      fi.addEventListener('change',function(e){
        var f=e.target.files[0];if(!f)return;
        startRecordUpload(item,f,ic,re);
      });
      ic.appendChild(fi);
    }
    tr.appendChild(ic);
    delCell(tr,function(){
      if(confirm('삭제할까요?')){var ri=D[key].indexOf(item);if(ri>-1)D[key].splice(ri,1);saveData(D);re();}

  add.onclick=function(){D[key].push({id:uid(),category:'',title:'',link:'',imageFile:''});saveData(D);re();};

  if(migrated)saveData(D);

  var doneCount=D.checklist.filter(function(c){return c.done;}).length;
  root.appendChild(secHead('여행준비 체크리스트',doneCount+'/'+D.checklist.length+' 완료'));

  var displayItems=D.checklist.slice().sort(function(a,b){
    var ai=CHECKLIST_CATS.indexOf(a.category);if(ai<0)ai=CHECKLIST_CATS.length;
    var bi=CHECKLIST_CATS.indexOf(b.category);if(bi<0)bi=CHECKLIST_CATS.length;
    return ai-bi;
  });
  var catColorMap={};var pi=0;
  displayItems.forEach(function(item){
    var cat=(item.category||'').trim();
    if(cat&&!(cat in catColorMap)){catColorMap[cat]=RECORD_CAT_PALETTE[pi%RECORD_CAT_PALETTE.length];pi++;}
  });
  var prevCat;

  var T=mkTable([{t:'완료',w:44},{t:'카테고리',w:100},{t:'항목',w:200},{t:'비고',w:150},{t:'',w:32}]);
  displayItems.forEach(function(item,idx){
    var tr=el('tr');
    var cat=(item.category||'').trim();
    if(idx>0&&cat!==prevCat)tr.classList.add('cat-boundary');
    prevCat=cat;
    if(cat&&catColorMap[cat]){tr.classList.add('cat-tinted');tr.style.setProperty('--cat-bg',catColorMap[cat]);}
    if(item.done)tr.classList.add('checklist-done');
    var s=function(full){saveData(D);if(full)re();};
    function td(cls){var c=el('td',cls);tr.appendChild(c);return c;}

    var cs=el('td','chk');
    var chk=el('input');chk.type='checkbox';chk.checked=!!item.done;
    chk.addEventListener('change',function(){item.done=chk.checked;saveData(D);re();});
    cs.appendChild(chk);tr.appendChild(cs);

    cellSelect(td(),item,'category',CHECKLIST_CATS,s);
    cellInput(td(),item,'text','text','항목',s);
    cellInput(td(),item,'memo','text','비고',s);
    delCell(tr,function(){
      if(confirm('삭제할까요?')){var ri=D.checklist.indexOf(item);if(ri>-1)D.checklist.splice(ri,1);saveData(D);re();}
    });
    T.tbody.appendChild(tr);
  });
  root.appendChild(T.wrap);
  scrollHint(T.wrap);

  var add=el('button','btn-add','+ 항목 추가');
  add.onclick=function(){D.checklist.push({id:uid(),category:CHECKLIST_CATS[0],text:'',done:false,memo:''});saveData(D);re();};
  root.appendChild(add);
}


var AllData = loadData();
var activeTripId = localStorage.getItem(ACTIVE_KEY);
if(!activeTripId||!AllData.trips[activeTripId])activeTripId=AllData.tripOrder[0];
var D = AllData.trips[activeTripId];
var TABS=[
 {k:'summary',  l:'SUMMARY',   s:'여행 전체 집계',        sec:'summaryNotes', r:function(x){tabSummary(x,D);}},
 {k:'itinerary',l:'일정',       s:'기간 · 타임테이블',      sec:'itinerary',    r:function(x){tabItinerary(x,D);}},
 {k:'flights',  l:'항공',       s:'출발 · 도착 항공편',     sec:'flights',      r:function(x){tabFlights(x,D);}},
 {k:'hotels',   l:'호텔',       s:'날짜별 숙박',           sec:'hotels',       r:function(x){tabHotels(x,D);}},
 {k:'tours',    l:'투어',       s:'지역별 투어 예약',       sec:'tours',        r:function(x){tabTours(x,D);}},
 {k:'expenses', l:'지출노트',    s:'날짜별 소비 · 소계',     sec:'expenses',     r:function(x){tabExpenses(x,D);}},
 {k:'rentalcar',l:'렌트카',     s:'예약 정보 · 업체 비교',   sec:'rentalcar',    r:function(x){tabRental(x,D);}},
 {k:'records',  l:'링크/이미지 기록', s:'제목 · 링크 · 이미지',   sec:'records',      r:function(x){tabRecords(x,D,'records','링크/이미지 기록');}},
 {k:'ideas',    l:'아이디어공간', s:'제목 · 내용 · 비고',   sec:'ideas',        r:function(x){tabIdeas(x,D);}},
 {k:'checklist',l:'체크리스트',  s:'출발 전 준비 확인',    sec:'checklist',    r:function(x){tabChecklist(x,D);}}
];
var bar=document.getElementById('appbar'),tb=document.getElementById('tabbar'),ct=document.getElementById('content'),tripBarEl=document.getElementById('tripbar');
function show(k){
  var t=null;
  for(var i=0;i<TABS.length;i++){if(TABS[i].k===k){t=TABS[i];break;}}
  if(!t)t=TABS[0];
  try{location.hash=t.k;}catch(e){}
  for(var j=0;j<tb.children.length;j++){
    var b=tb.children[j];
    b.className=(b.getAttribute('data-k')===t.k)?'tab-btn active':'tab-btn';
  }
  curSection=t.sec;curTab=t;
  buildTripBar(tripBarEl);
  buildAppBar(bar);
  window.scrollTo(0,0);
  t.r(ct);
}
TABS.forEach(function(t){
  var b=document.createElement('button');
  b.className='tab-btn';b.setAttribute('data-k',t.k);b.textContent=t.l;
  b.onclick=function(){show(t.k);};
  tb.appendChild(b);
});
show((location.hash||'').replace('#','')||'summary');
window.scrollTo(0,tb.offsetTop);
fbInit();

</script>
